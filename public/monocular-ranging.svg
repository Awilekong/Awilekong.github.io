    <g fill="none" stroke="#7c76a6" stroke-width="5" stroke-linecap="round">
      <rect x="929" y="127" width="173" height="151" rx="12" fill="#f8f8fc"/>
      <path d="M951 161h124M951 194h94M951 227h63"/>
    </g>
    <text x="185" y="326" text-anchor="middle" font-size="32" font-weight="700">RGB camera</text>
    <text x="600" y="326" text-anchor="middle" font-size="32" font-weight="700">Depth model</text>
    <text x="1015" y="326" text-anchor="middle" font-size="32" font-weight="700">Depth map</text>
    <text x="42" y="410" font-size="26" fill="#64818a">KITTI fine-tuning · Jetson Nano · Wheeltec robot car</text>
  </g>
</svg>
